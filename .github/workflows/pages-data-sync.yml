name: Pages Data Sync
# ФИКС КРИТИЧНОГО БАГА (03.10.2026): deploy-pages.yml триггерится ТОЛЬКО на статику
# (index.html/sw.js/...), поэтому обновления docs/*.json (status/gifts/images/live)
# никогда не публиковались на Pages — сайт у части юзеров (где raw.githubusercontent.com
# блокируется провайдером и браузер падает в BASE='./' фоллбэк) показывал данные
# ВОЗРАСТОМ 17+ ЧАСОВ. Это отдельный лёгкий деплой по расписанию — публикует ТЕКУЩИЙ
# снимок docs/ на Pages каждые 2 минуты (v25: чаще свежее для сетей, где api.github.com недоступен и sha-пин не обновляется), независимо от того, сколько раз движок коммитил
# данные между запусками. Общая concurrency-группа с deploy-pages.yml — лишние запуски
# гасятся cancel-in-progress, а не копятся в очереди.
on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
      # jsDelivr — последний фолбэк-источник юзеров из Узбекистана (raw + Pages у них
      # часто блокированы). CDN кэширует ветку надолго → без purge юзер видел данные
      # возрастом 1-17 часов. Purge сбрасывает кэш всех 10 дата-файлов каждый прогон.
      - name: Purge jsDelivr CDN (все данные)
        run: |
          for f in floors-hist.json floors.json gifts.json health.json history.json images.json leaders.json live.json partners.json status.json; do
            curl -fsS -m 30 "https://purge.jsdelivr.net/gh/jethubvideo-code/gifttracker-bot@main/docs/$f" || true
          done

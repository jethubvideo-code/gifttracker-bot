name: Gift Monitor (watchdog)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gift-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run full monitor (watchdog mode)
        run: node gift-monitor/actions/full-job.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
          TONAPI_KEY: ${{ vars.TONAPI_KEY }}
          CRYPT_KEY: ${{ vars.CRYPT_KEY }}
          MODE: ''
          FORCE: ''
          EVENT_NAME: schedule
          GITHUB_TOKEN: ${{ github.token }}

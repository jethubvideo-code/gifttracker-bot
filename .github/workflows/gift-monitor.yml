name: Gift Monitor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим: sendtest (тест владельцу) или пусто"
        default: ""
      force:
        description: "true = прогнать даже если standby выключен"
        default: "false"

permissions:
  contents: write

concurrency:
  group: gift-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run monitor
        run: node gift-monitor/actions/monitor-job.js
        env:
          TONAPI_KEY: ${{ secrets.TONAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CRYPT_KEY: ${{ secrets.CRYPT_KEY }}
          MODE: ${{ github.event.inputs.mode || '' }}
          FORCE: ${{ github.event.inputs.force || '' }}

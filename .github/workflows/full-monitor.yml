name: Gift Monitor Full (standby)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "sendtest = тест владельцу, пусто = обычный прогон"
        default: ""
      force:
        description: "true = прогнать даже если выключен; chain = режим эстафеты 24/7"
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: gift-monitor-full
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Run full monitor
        run: node gift-monitor/actions/full-job.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
          TONAPI_KEY: ${{ vars.TONAPI_KEY }}
          CRYPT_KEY: ${{ vars.CRYPT_KEY }}
          MODE: ${{ github.event.inputs.mode || '' }}
          FORCE: ${{ github.event.inputs.force || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}

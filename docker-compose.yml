<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Рынок подарков Telegram</title>
<meta name="version" content="3-ultra">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
:root{
--bg:#050810;--bg2:#0a0f1d;
--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.028);
--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.14);
--gold:#ffc94d;--gold2:#f0a92e;
--green:#2ee6a8;--red:#ff5d7a;--blue:#4d9cff;--vio:#8e5cf6;
--tx:#f2f4ff;--tx2:#96a3c2;--tx3:#5f6f95;
--r-sm:12px;--r-md:16px;--r-lg:20px;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;
--sh:0 8px 28px -10px rgba(0,0,0,.7);
--tab-h:56px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;color:var(--tx);
background:var(--bg);background-image:
radial-gradient(58% 38% at 12% -4%,rgba(77,156,255,.16),transparent 62%),
radial-gradient(46% 32% at 96% 2%,rgba(142,92,246,.15),transparent 60%),
radial-gradient(70% 46% at 50% 112%,rgba(46,230,168,.09),transparent 60%),
radial-gradient(40% 30% at 78% 55%,rgba(255,201,77,.05),transparent 60%);
background-attachment:fixed;letter-spacing:.01em;
padding:0 clamp(10px,3vw,18px) calc(var(--tab-h) + 128px + env(safe-area-inset-bottom));
-webkit-font-smoothing:antialiased}
@media(min-width:900px){body{display:flex;justify-content:center}body>*{width:100%;max-width:1100px}}
.wrap{max-width:1100px;margin:0 auto;position:relative}
@media(min-width:900px){.wrap::before{content:"";position:fixed;top:-30%;left:50%;width:60vmax;height:60vmax;
margin-left:-30vmax;background:conic-gradient(from 0deg,rgba(77,156,255,.07),rgba(142,92,246,.07),rgba(255,201,77,.05),rgba(46,230,168,.06),rgba(77,156,255,.07));
border-radius:50%;filter:blur(70px);z-index:-1;animation:aur 44s linear infinite;pointer-events:none}}
@keyframes aur{to{transform:rotate(1turn)}}

/* ---------- header ---------- */
.hd{padding:calc(14px + env(safe-area-inset-top)) 4px 2px;animation:fu .45s ease}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.livebadge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:900;letter-spacing:.12em;
padding:5px 10px;border-radius:999px;background:rgba(46,230,168,.1);border:1px solid rgba(46,230,168,.28);color:var(--green)}
.livebadge .pl{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pl 1.6s infinite;position:relative}
.livebadge .pl::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(46,230,168,.55);animation:ping 1.6s cubic-bezier(.2,.6,.4,1) infinite}
@keyframes ping{0%{transform:scale(.5);opacity:1}80%,100%{transform:scale(1.9);opacity:0}}
.livebadge.off{background:rgba(255,93,122,.1);border-color:rgba(255,93,122,.3);color:var(--red)}
.livebadge.off .pl{background:var(--red);box-shadow:0 0 10px var(--red);animation:none}
.livebadge.off .pl::after{display:none}
.livebadge #livetime{font-weight:800;letter-spacing:.02em;opacity:.92}
.langbtn{background:var(--card);border:1px solid var(--line);color:var(--tx2);font-size:11px;font-weight:900;
padding:6px 12px;border-radius:999px;cursor:pointer;min-height:32px;transition:.18s}
.langbtn:active{transform:scale(.92)}
.crown{display:block;margin:10px auto 0;width:30px;height:30px;filter:drop-shadow(0 2px 14px rgba(255,201,77,.6));animation:crownf 3.4s ease-in-out infinite}
@keyframes crownf{0%,100%{filter:drop-shadow(0 2px 10px rgba(255,201,77,.45))}50%{filter:drop-shadow(0 3px 18px rgba(255,201,77,.8))}}
.hd h1{font-size:21px;font-weight:900;text-align:center;margin-top:2px;letter-spacing:.01em;
background:linear-gradient(100deg,#fff 10%,#9cc7ff 35%,#d3b6ff 55%,#ffd76a 75%,#fff 90%);
background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
animation:titleslide 7s ease-in-out infinite}
@keyframes titleslide{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.hd .sub{color:var(--tx2);font-size:11.5px;margin-top:5px;font-weight:600;text-align:center;min-height:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.st{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);
border-radius:var(--r-md);padding:10px 8px 9px;text-align:center;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.05)}
.st .v{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;
background:linear-gradient(135deg,#ffd76a,#f0a92e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
filter:drop-shadow(0 0 10px rgba(255,201,77,.22))}
.st .l{font-size:9px;color:var(--tx2);text-transform:uppercase;letter-spacing:.09em;font-weight:800;margin-top:3px}

/* ---------- search ---------- */
.sr{position:sticky;top:0;z-index:9;padding:10px 0 8px;display:flex;gap:8px}
.srch{position:relative;flex:1}
.sr input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r-md);color:var(--tx);
padding:13px 42px 13px 44px;font-size:15.5px;font-weight:500;outline:none;transition:border-color .2s,box-shadow .2s;min-height:47px}
.sr input::placeholder{color:var(--tx3)}
.sr input:focus{border-color:rgba(77,156,255,.75);box-shadow:0 0 0 3px rgba(77,156,255,.16),0 0 22px -6px rgba(77,156,255,.45)}
.sr input:focus-visible{outline:none}
.sic{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--tx3);pointer-events:none}
.qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;
border:none;background:rgba(255,255,255,.09);color:var(--tx2);font-size:15px;font-weight:800;cursor:pointer;display:none;
align-items:center;justify-content:center;transition:transform .15s}
.qclear:active{transform:translateY(-50%) scale(.88)}

/* ---------- chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--card);border:1px solid var(--line);color:var(--tx2);
font-size:11.5px;font-weight:800;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.18s;min-height:36px;white-space:nowrap}
.chip:active{transform:scale(.95)}
.chip.on{background:linear-gradient(135deg,rgba(77,156,255,.24),rgba(142,92,246,.24));border-color:rgba(77,156,255,.55);color:#bcd8ff;
box-shadow:0 4px 16px -4px rgba(77,156,255,.45),inset 0 1px 0 rgba(255,255,255,.12)}

/* ---------- sections & grid ---------- */
.sect{margin:16px 0 11px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sect b{font-size:15.5px;font-weight:850;position:relative;padding-left:12px}
.sect b::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:15px;border-radius:3px;
background:linear-gradient(180deg,#ffd76a,#f0a92e);box-shadow:0 0 8px rgba(255,201,77,.45)}
.sect small{color:var(--tx3);font-size:10.5px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:540px){.grid{grid-template-columns:repeat(3,1fr);gap:12px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}

/* ---------- card ---------- */
.card{position:relative;background:linear-gradient(165deg,var(--card) 0%,var(--card2) 100%);
border:1px solid var(--line);border-radius:var(--r-md);padding:12px 12px 11px;box-shadow:var(--sh);
transition:transform .16s ease,border-color .2s,box-shadow .2s;content-visibility:auto;contain-intrinsic-size:132px}
.card:active{transform:scale(.97);border-color:var(--line2)}
@media(hover:hover){.card:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 14px 34px -12px rgba(0,0,0,.8)}}
.card.rk{border-color:rgba(255,201,77,.34)}
.card[data-r="1"]{border-color:rgba(255,201,77,.62);box-shadow:0 10px 30px -10px rgba(255,201,77,.32);animation:kinglow 3.2s ease-in-out infinite}
@keyframes kinglow{0%,100%{box-shadow:0 10px 30px -10px rgba(255,201,77,.28)}50%{box-shadow:0 12px 36px -10px rgba(255,201,77,.5)}}
.rank{position:absolute;top:-8px;right:10px;font-size:10px;font-weight:900;color:#0a0e18;border-radius:8px;padding:3px 8px;
background:linear-gradient(135deg,#ffd76a,#f0a92e);box-shadow:0 3px 10px rgba(255,201,77,.45)}
.card[data-r="1"] .rank{background:linear-gradient(120deg,#ffe9a8,#f0a92e 50%,#ffd76a);background-size:200% 100%;animation:goldslide 2.6s linear infinite}
@keyframes goldslide{to{background-position:-200% 0}}
.card[data-r="2"] .rank{background:linear-gradient(135deg,#f4f7fd,#a9b4c7)}
.card[data-r="3"] .rank{background:linear-gradient(135deg,#f0b077,#c97a3e)}
.cname{font-weight:800;font-size:13px;line-height:1.3;display:flex;align-items:center;gap:5px;min-height:34px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 8px var(--green);animation:pl 2s infinite;flex-shrink:0}
.cfloor{display:flex;align-items:center;gap:5px;margin:6px 0 2px;flex-wrap:wrap}
.cfloor b{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;
background:linear-gradient(135deg,#ffe9a8,#f0a92e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
filter:drop-shadow(0 0 10px rgba(255,201,77,.25))}
.toni{width:13px;height:13px;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(255,201,77,.4))}
.cfloor i{font-style:normal;font-size:10px;font-weight:900;color:var(--gold2);letter-spacing:.08em}
.na{color:var(--tx3);font-size:16px;font-weight:800}
.pill{font-size:10px;font-weight:900;padding:3px 7px;border-radius:999px;font-variant-numeric:tabular-nums;margin-left:2px}
.pill.up{background:rgba(46,230,168,.13);color:var(--green);box-shadow:inset 0 0 10px rgba(46,230,168,.1)}
.pill.down{background:rgba(255,93,122,.13);color:var(--red);box-shadow:inset 0 0 10px rgba(255,93,122,.1)}
.pill.flat{background:rgba(150,163,194,.12);color:var(--tx2)}
.lst{font-size:10.5px;color:var(--tx2);font-weight:700}
.lst.dim{color:var(--tx3)}
.bar{height:4px;border-radius:4px;background:rgba(150,163,194,.16);margin:9px 0 5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--green));position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.25) 6px 12px);animation:barsheen 1.6s linear infinite}
@keyframes barsheen{to{transform:translateX(12px)}}
.cmeta{color:var(--tx3);font-size:9.5px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:10px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{font-size:11px;font-weight:800;text-decoration:none;padding:8px 12px;border-radius:10px;color:#fff;transition:.15s;letter-spacing:.02em;border:0;cursor:pointer;min-height:36px;
box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.btn:active{transform:scale(.94)}
@media(hover:hover){.btn:hover{filter:brightness(1.12)}}
.btn.m{background:linear-gradient(135deg,#4d9cff,#1f7fe8);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 14px -4px rgba(77,156,255,.6)}
.btn.p{background:linear-gradient(135deg,#9a6cff,#7c3aed);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 14px -4px rgba(142,92,246,.55)}
.btn.g{background:linear-gradient(135deg,#12c99a,#0aa07e);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 14px -4px rgba(46,230,168,.55)}
.btn.v{background:rgba(150,163,194,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.none{color:var(--tx2);text-align:center;padding:26px;font-size:13.5px;font-weight:700;display:none}
.retrybtn{display:none;margin:10px auto 0;background:linear-gradient(135deg,#4d9cff,#8e5cf6);border:none;color:#fff;
font-size:13px;font-weight:800;padding:11px 22px;border-radius:12px;cursor:pointer;min-height:44px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 22px -8px rgba(77,156,255,.7)}
.retrybtn:active{transform:scale(.95)}
.errwrap{text-align:center;padding:18px 0}

/* ---------- skeleton ---------- */
.skel{border-radius:var(--r-md);background:linear-gradient(100deg,var(--card) 35%,rgba(255,255,255,.09) 50%,var(--card) 65%);
background-size:250% 100%;animation:shim 1.2s linear infinite;height:132px;border:1px solid var(--line)}
@keyframes shim{from{background-position:140% 0}to{background-position:-140% 0}}

/* ---------- cta ---------- */
.cta{position:fixed;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 9px);left:0;right:0;padding:0 14px;z-index:9}
.cta a{position:relative;display:block;overflow:hidden;background:linear-gradient(100deg,#4d9cff,#5c7cfa 55%,#8e5cf6);
color:#fff;font-weight:850;text-decoration:none;border-radius:var(--r-lg);padding:15px;font-size:14.5px;letter-spacing:.02em;text-align:center;
box-shadow:0 12px 34px -10px rgba(64,120,255,.85),inset 0 1px 0 rgba(255,255,255,.3);animation:ctaglow 2.8s ease-in-out infinite}
@keyframes ctaglow{0%,100%{box-shadow:0 12px 34px -10px rgba(64,120,255,.75),inset 0 1px 0 rgba(255,255,255,.3)}50%{box-shadow:0 14px 40px -8px rgba(142,92,246,.85),inset 0 1px 0 rgba(255,255,255,.3)}}
.cta a::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);animation:sh 2.6s infinite}
.cta a:active{transform:scale(.98)}

/* ---------- tabs ---------- */
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;z-index:20;background:rgba(8,12,24,.88);
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
.tab{flex:1;text-align:center;color:var(--tx3);font-size:9.5px;font-weight:800;text-decoration:none;
padding:5px 2px;border-radius:12px;transition:.2s;letter-spacing:.04em;min-height:44px;position:relative}
.tab svg{width:20px;height:20px;margin:2px auto 1px;display:block}
.tab.on{color:var(--blue)}
.tab.on svg{filter:drop-shadow(0 0 8px rgba(77,156,255,.7));animation:tabpop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes tabpop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.tab.on::after{content:"";position:absolute;left:50%;bottom:2px;width:14px;height:2.5px;border-radius:2px;
transform:translateX(-50%);background:linear-gradient(90deg,var(--blue),var(--vio));box-shadow:0 0 8px rgba(77,156,255,.8)}
.tab:active{transform:scale(.94)}

/* ---------- profile ---------- */
.phead{display:flex;align-items:center;gap:14px;margin:18px 0 14px;animation:fu .4s ease}
.pavatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#1b2a4a,#141e33) center/cover no-repeat;
position:relative;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#9cc7ff;
box-shadow:0 0 0 3px rgba(255,201,77,.55),0 0 0 5px rgba(255,201,77,.16),0 0 24px -4px rgba(255,201,77,.4),0 6px 18px -6px rgba(0,0,0,.6)}
.pname{font-size:18px;font-weight:850}
.puser{color:var(--tx2);font-size:12px;font-weight:600;margin-top:1px}
.badge{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:900;padding:4px 10px;border-radius:999px;letter-spacing:.05em}
.badge.vip{background:linear-gradient(120deg,#ffe9a8,#f0a92e);color:#0a0e18;box-shadow:0 2px 12px rgba(255,201,77,.5);animation:goldslide 3s linear infinite;background-size:200% 100%}
.badge.free{background:rgba(150,163,194,.16);color:#9cc7ff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r-md);padding:13px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.05)}
.tile .tv{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;
background:linear-gradient(135deg,#ffd76a,#f0a92e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
filter:drop-shadow(0 0 10px rgba(255,201,77,.2))}
.tile .tl{font-size:10.5px;color:var(--tx2);font-weight:700;margin-top:3px}
.pcard{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r-md);
padding:14px;margin-bottom:11px;font-size:13px;line-height:1.5;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.05);animation:fu .4s ease}
.pcard b{font-size:13.5px}
.hint{color:var(--tx3);font-size:10.5px;margin-top:6px;font-weight:600}
.refrow{display:flex;gap:7px;margin-top:9px;align-items:center}
.refrow code{flex:1;background:rgba(5,8,16,.65);border:1px solid var(--line);border-radius:10px;padding:10px;
font-size:11px;color:#9cc7ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:40px;line-height:20px}

/* ---------- features ---------- */
.fcard{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r-md);
padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.05);animation:fu .4s ease both;
content-visibility:auto;contain-intrinsic-size:66px;transition:border-color .2s,transform .16s}
.fcard:active{transform:scale(.98)}
@media(hover:hover){.fcard:hover{border-color:var(--line2)}}
.fico{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,rgba(77,156,255,.17),rgba(142,92,246,.17));border:1px solid rgba(77,156,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.fico svg{width:17px;height:17px}
.fcard b{font-size:13.5px;display:block}
.fcard .fd{color:var(--tx2);font-size:11px;margin-top:2px;line-height:1.4}
.fcard .go{margin-left:auto;color:var(--blue);font-weight:900;text-decoration:none;font-size:15px;flex-shrink:0;padding:8px 4px 8px 12px;min-height:44px}
.fcard .go:active{transform:scale(.9)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 84px);transform:translate(-50%,14px);
background:rgba(10,15,29,.96);border:1px solid rgba(255,201,77,.3);color:var(--tx);font-size:13px;font-weight:700;
padding:12px 18px;border-radius:14px;z-index:40;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 14px 38px -8px rgba(0,0,0,.8),0 0 24px -8px rgba(255,201,77,.25);text-align:center;max-width:86vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- states & motion ---------- */
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid rgba(255,201,77,.7);outline-offset:2px}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes sh{0%{left:-80%}55%,100%{left:130%}}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
@media(min-width:540px){.cta{max-width:530px;left:50%;transform:translateX(-50%);padding:0}}
@media(min-width:900px){.cta{max-width:1100px}}
body.light{--bg:#eef2f9;--bg2:#ffffff;--card:#ffffff;--card2:#ffffff;--line:rgba(20,40,80,.12);--line2:rgba(20,40,80,.18);--tx:#0f1a2e;--tx2:#54627e;--tx3:#7d8aa3;--sh:0 8px 24px -12px rgba(30,50,90,.25)}
body.light .tabs{background:rgba(255,255,255,.92)}
body.light .sr input{background:#fff}
body.light .refrow code{background:rgba(20,40,80,.05)}
body.light #toast{background:rgba(255,255,255,.97)}
body.light .wrap::before{display:none}
</style></head><body>
<div class="wrap">

<div id="pg-market">
<div class="hd">
<div class="hd-top">
<span class="livebadge" id="livebadge"><span class="pl"></span>&nbsp;LIVE&nbsp;<span id="livetime">—</span></span>

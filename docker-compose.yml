function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return Number(n||0).toLocaleString('ru-RU');}
function hap(k){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(k||'light');}catch(e){}}

function showTab(n){
document.getElementById('pg-market').style.display=n==='market'?'':'none';
document.getElementById('pg-profile').style.display=n==='profile'?'':'none';
document.getElementById('pg-features').style.display=n==='features'?'':'none';
['market','profile','features'].forEach(function(k){
document.getElementById('tab-'+k).className='tab'+(k===n?' on':'');});
document.querySelector('.cta').style.display=n==='market'?'':'none';
window.scrollTo(0,0);hap('light');
}

/* поиск + очистка */
var q=document.getElementById('q');
function fl(){var v=q.value.trim().toLowerCase(),n=0;
document.querySelectorAll('#all .card').forEach(function(c){var m=!v||c.getAttribute('data-n').indexOf(v)>-1;c.style.display=m?'':'none';if(m)n++;});
document.getElementById('none').style.display=n?'none':'block';
document.getElementById('qclear').style.display=v?'flex':'none';}
q.addEventListener('input',fl);
document.getElementById('qclear').onclick=function(){q.value='';fl();q.focus();hap('light');};

/* сортировка «Все подарки» */
var SORT='floor',CARDS=null;
function renderAll(){if(!CARDS)return;var list=CARDS.slice();
if(SORT==='az')list.sort(function(a,b){return a.name.localeCompare(b.name);});
else if(SORT==='move')list.sort(function(a,b){return Math.abs(b.chgc||0)-Math.abs(a.chgc||0);});
else list.sort(function(a,b){return b.floor-a.floor;});
document.getElementById('all').innerHTML=list.map(function(c){return cardHtml(c,0);}).join('');fl();}
['floor','az','move'].forEach(function(k){document.getElementById('ch-'+k).onclick=function(){
SORT=k;hap('light');['floor','az','move'].forEach(function(j){document.getElementById('ch-'+j).className='chip'+(j===k?' on':'');});renderAll();};});

var TONI='<svg class="toni" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 8v8l8 6 8-6V8l-8-6Z" fill="url(#tgr)"/><defs><linearGradient id="tgr" x1="4" y1="2" x2="20" y2="22"><stop stop-color="#ffe9a8"/><stop offset="1" stop-color="#f0a92e"/></linearGradient></defs></svg>';
function cardHtml(c,rank){
var chg=c.chgc?Math.round(c.chgc*1000)/10:0;
var pct=c.supply>0?Math.min(100,Math.round(c.listed/c.supply*100)):0;
var btns='<a class="btn p" href="https://t.me/portals/market?startapp='+esc(c.slug)+'" target="_blank">Portals</a>'+
'<a class="btn m" href="https://t.me/mrkt?startapp='+esc(c.slug)+'" target="_blank">MRKT</a>';
return '<div class="card'+(rank?' rk':'')+'"'+(rank?' data-r="'+rank+'"':'')+' data-n="'+esc(c.name.toLowerCase())+'">'+
(rank?'<div class="rank">'+rank+'</div>':'')+
'<div class="cname">'+esc(c.name)+(chg>0?' <span class="dot"></span>':'')+'</div>'+
'<div class="cfloor">'+(c.floor>0?'<b>'+c.floor.toFixed(2)+'</b>'+TONI+'<i>TON</i>':'<span class="na">—</span>')+
'<span class="pill '+(chg>0?'up':(chg<0?'down':'flat'))+'">'+(chg>0?'▲ +'+chg+'%':(chg<0?'▼ '+chg+'%':'—'))+'</span></div>'+
(c.listed>0?'<div class="lst">'+fmt(c.listed)+' '+L('lots')+'</div>':'<div class="lst dim">'+L('nolots')+'</div>')+
'<div class="bar"><i style="width:'+pct+'%"></i></div>'+
'<div class="cmeta">'+fmt(c.listed)+' '+L('iz')+' '+fmt(c.supply)+' · '+pct+'% '+L('onsale')+'</div>'+
'<div class="btns">'+btns+'</div></div>';
}

/* skeleton + загрузка + ошибка с «Повторить» */
function skel(n){var s='';for(var i=0;i<n;i++)s+='<div class="skel"></div>';return s;}
document.getElementById('fresh').innerHTML=skel(6);
document.getElementById('top').innerHTML=skel(6);
document.getElementById('all').innerHTML=skel(8);
document.getElementById('sub').textContent=L('loading');
function fail(){document.getElementById('sub').textContent=L('loadfail');
document.getElementById('livebadge').className='livebadge off';
document.getElementById('livetime').textContent='—';
document.getElementById('retrybtn').style.display='inline-flex';}
function countUp(id,val){var el=document.getElementById(id);if(!el)return;var t=Math.round(val)||0;
try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=fmt(t);return;}}catch(e){el.textContent=fmt(t);return;}
var st=null,dur=650;function step(ts){if(!st)st=ts;var p=Math.min(1,(ts-st)/dur);p=1-Math.pow(1-p,3);el.textContent=fmt(Math.round(t*p));if(p<1)requestAnimationFrame(step);}
requestAnimationFrame(step);}
function load(){
document.getElementById('retrybtn').style.display='none';
document.getElementById('sub').textContent=L('loading');
document.getElementById('fresh').innerHTML=skel(6);
document.getElementById('top').innerHTML=skel(6);
document.getElementById('all').innerHTML=skel(8);
fetch(API).then(function(r){return r.json();}).then(function(d){
if(!d||!d.collections||!d.collections.length){fail();return;}
var fc=d.floor_changes||{};
var cards=d.collections.map(function(c){return{name:c.name,slug:c.short_name,floor:parseFloat(c.floor_price)||0,listed:c.listed_count||0,supply:c.supply||0,chgc:parseFloat(fc[c.id])||0};}).sort(function(a,b){return b.floor-a.floor;});
CARDS=cards;
var now=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
document.getElementById('sub').textContent=cards.length+' '+L('colls')+' · '+L('floors_p')+' · '+L('updated')+' '+now;
document.getElementById('livetime').textContent=now;
document.getElementById('livebadge').className='livebadge';
countUp('st1',cards.length);
countUp('st2',cards.filter(function(c){return c.floor>0;}).length);
countUp('st3',cards.reduce(function(a,c){return a+(c.listed||0);},0));
var mv=cards.slice().sort(function(a,b){return Math.abs(b.chgc)-Math.abs(a.chgc);}).slice(0,6);
document.getElementById('fresh').innerHTML=mv.map(function(c){return cardHtml(c,0);}).join('');
document.getElementById('top').innerHTML=cards.slice(0,12).map(function(c,i){return cardHtml(c,i+1);}).join('');
renderAll();
}).catch(fail);}
document.getElementById('retrybtn').onclick=function(){hap('light');load();};
load();

/* хаптика на кнопках карточек */
document.addEventListener('click',function(e){if(e.target&&e.target.classList&&e.target.classList.contains('btn'))hap('light');});

/* toast */
var toastEl=document.getElementById('toast'),toastT=null;
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('show');},2800);}

/* настоящая оплата VIP через Telegram Stars */
function vipFallback(){if(tg&&tg.openTelegramLink){tg.openTelegramLink(VIPBOT);}else{window.open(VIPBOT,'_blank');}}
function buyVip(ev){if(ev&&ev.preventDefault)ev.preventDefault();
hap('medium');
if(!(tg&&tg.openInvoice)){vipFallback();return;}
toast(L('pay_wait'));
fetch(PAYURL,{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
if(d&&d.ok&&d.link){tg.openInvoice(d.link,function(st){
if(st==='paid'){try{tg.HapticFeedback.notificationOccurred('success');}catch(e){}toast(L('paid'));
var b=document.getElementById('pbadge');if(b){b.textContent='VIP ⭐️';b.className='badge vip';}
var a=document.querySelector('.cta a');if(a)a.textContent='✅ '+L('paid');}
});}else{vipFallback();}
}).catch(vipFallback);}

/* профиль */
if(USER){
document.getElementById('pname').textContent=USER.first_name||USER.last_name||'Коллекционер';
if(USER.username)document.getElementById('puser').textContent='@'+USER.username;
var av=document.getElementById('pavatar');
if(USER.photo_url){av.style.backgroundImage='url('+USER.photo_url+')';av.querySelector('span').style.display='none';}
else{av.querySelector('span').textContent=(USER.first_name||'?').charAt(0).toUpperCase();}
var rl='https://t.me/Trackingonebot?start=ref_'+USER.id;
document.getElementById('reflink').textContent=rl;
document.getElementById('copybtn').onclick=function(){
try{navigator.clipboard.writeText(rl);}catch(e){}
try{if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('medium');}catch(e){}
this.textContent='✅';var b=this;setTimeout(function(){b.textContent='📋';},1500);};
document.getElementById('pbadge').textContent=L('pbadge');
document.getElementById('pmodes').innerHTML=L('pmodes');
document.getElementById('vipcta').innerHTML=L('vt')+'<br>'+L('vd')+'<div class="hint">'+L('vh')+'</div><a class="btn m" href="'+VIPBOT+'" target="_blank" onclick="buyVip(event)">'+L('vbtn')+'</a>';
if(tg&&tg.MainButton){tg.MainButton.setText(L('mb_user'));tg.MainButton.show();
tg.MainButton.onClick(function(){buyVip();});
document.getElementById('cta').style.display='none';}
}else{
document.getElementById('pguest').style.display='';
document.getElementById('pmain').style.display='none';
}
if(tg&&tg.MainButton&&!USER){tg.MainButton.setText(L('mb_guest'));tg.MainButton.show();
tg.MainButton.onClick(function(){tg.openTelegramLink('https://t.me/Trackingonebot');});
document.getElementById('cta').style.display='none';}

applyLang();
</script>
</body></html>
